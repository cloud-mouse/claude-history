<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgDark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2d2722"/>
      <stop offset="1" stop-color="#0b0907"/>
    </linearGradient>
    <linearGradient id="topGloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.18"/>
      <stop offset="0.45" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.40"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="aura" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#e07a4f" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#e07a4f" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="metalOrange" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd9b8"/>
      <stop offset="0.42" stop-color="#e07a4f"/>
      <stop offset="0.62" stop-color="#cf6638"/>
      <stop offset="1" stop-color="#8c2e11"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="175%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="13"/>
      <feOffset dx="0" dy="16" result="off"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.5"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow" x="-70%" y="-70%" width="240%" height="240%">
      <feGaussianBlur stdDeviation="7" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="512" height="512" rx="115" fill="url(#bgDark)"/>
  <rect width="512" height="512" rx="115" fill="url(#topGloss)"/>
  <rect x="1.5" y="1.5" width="509" height="509" rx="113.5" fill="none" stroke="url(#rim)" stroke-width="2.5"/>
  <circle cx="256" cy="256" r="190" fill="url(#aura)"/>
  <path d="M 348 138 A 150 150 0 1 0 348 374" fill="none" stroke="url(#metalOrange)" stroke-width="70" stroke-linecap="round" filter="url(#shadow)"/>
  <path d="M 200 118 A 150 150 0 0 1 312 118" fill="none" stroke="#fff4ec" stroke-opacity="0.55" stroke-width="9" stroke-linecap="round"/>
  <g filter="url(#glow)">
    <circle cx="370" cy="200" r="17" fill="#ffc6a0"/>
    <circle cx="386" cy="256" r="17" fill="#ffc6a0"/>
    <circle cx="370" cy="312" r="17" fill="#ffc6a0"/>
  </g>
</svg>
