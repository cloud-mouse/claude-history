name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete existing release if any
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release delete "${{ github.ref_name }}" --yes --repo "${{ github.repository }}" || true

  release:
    needs: cleanup
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
          - os: windows-latest
          - os: ubuntu-latest

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build Vue app
        run: npm run build

      - name: Build & Release Electron app
        run: npx electron-builder --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-release-notes:
    needs: release
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Update release notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG=${GITHUB_REF_NAME}

          cat > /tmp/release-notes.md << 'BODY'
          ## Claude History

          A desktop app for browsing and managing your Claude Code conversation history.

          ---

          ### Features

          - **Three-panel layout** — Project list, conversation list, and message detail view; each panel is collapsible and resizable
          - **Conversation browsing** — Auto-discovers all projects from `~/.claude/projects/`, with search and smart date formatting
          - **Rich message rendering** — Full Markdown support, syntax-highlighted code blocks, image preview with lightbox
          - **Claude tool visualization** — Dedicated components for Edit, Write, Read, Glob, Grep, Agent, Thinking, Todo, Task tools and more
          - **Session resume** — One-click to open terminal and resume a Claude Code session
          - **4 built-in themes** — Light, Dark, Warm, and Monokai with instant switching
          - **SQLite caching** — Fast loading with local database cache and LRU in-memory cache
          - **Smart title extraction** — Automatically generates conversation titles from message content

          ### Downloads

          | Platform | File | Notes |
          |----------|------|-------|
          | macOS (Apple Silicon) | `*.dmg` | Drag to Applications folder |
          | macOS (Apple Silicon) | `*.zip` | Portable, unzip and run |
          | Windows | `*.exe` (NSIS) | Standard installer |
          | Windows | `*.exe` (Portable) | No installation needed |
          | Linux | `*.AppImage` | Make executable and run |

          ### ⚠️ macOS 安装提示（应用未做代码签名）

          应用未做 Apple 代码签名，从浏览器下载的安装包在较新 macOS（Sequoia 等）上会提示「已损坏，无法打开」。**应用本身没有损坏**，这是 macOS Gatekeeper 对未签名应用的隔离。打开「终端」执行下面命令解除即可：

          ```
          xattr -cr "/Applications/Claude History.app"
          ```

          ### 关于自动更新

          - **Windows / Linux**：支持应用内自动检查与更新（未签名，首次运行会有 SmartScreen 提示，属正常）。
          - **macOS**：因未签名，**不支持应用内自动更新**（electron-updater 在 mac 上强制要求签名）。请手动下载新版覆盖安装。

          ### System Requirements

          - **macOS** 10.15+ (Catalina or later)
          - **Windows** 10 or later
          - **Linux** — Most distributions with glibc 2.28+

          ---

          **Full Changelog**: https://github.com/cloud-mouse/claude-history/commits/${TAG}
          BODY

          sed -i "s|\${TAG}|$TAG|g" /tmp/release-notes.md

          gh release edit "$TAG" --notes-file /tmp/release-notes.md --repo "${{ github.repository }}"
