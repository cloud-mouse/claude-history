name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete existing release if any
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release delete "${{ github.ref_name }}" --yes --repo "${{ github.repository }}" || true

  release:
    needs: cleanup
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
          - os: windows-latest
          - os: ubuntu-latest

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build Vue app
        run: npm run build

      - name: Build & Release Electron app
        run: npx electron-builder --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-release-notes:
    needs: release
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Update release notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG=${GITHUB_REF_NAME}

          cat > /tmp/release-notes.md << 'BODY'
          ## Claude History

          A desktop app for browsing and managing your Claude Code conversation history.

          ---

          ### 🆕 本次更新（v1.5.0）

          - **毛玻璃效果开关**：设置 → 外观新增「毛玻璃效果」开关，让整个应用窗口呈现原生毛玻璃（macOS vibrancy / Windows acrylic），默认开启、即时切换、跨重启持久化；Linux 自动隐藏。
          - **修复毛玻璃从未生效**：vibrancy 自首次配置以来一直未真正渲染——本次修复两个根因（窗口缺少透明背景 + CSS 透明选择器写成后代选择器导致永不匹配），macOS 上首次真正透出毛玻璃。
          - **统一设置中心**：原分散的统计/更新/主题入口合并为一个设置弹窗（飞书桥接 / 外观 / 使用统计 / 关于与更新）；工具栏精简为齿轮 + 全文搜索；齿轮徽章同时提示「飞书已连接」与「有新版本」。
          - **会话右键菜单**：新的下拉菜单替换悬浮删除按钮，支持绑定/解绑飞书、恢复会话、复制命令、删除（带确认）。
          - **消息块统一**：全部可折叠块（思考、11 种工具块、工具调用/结果）统一为 CollapsibleBlock——一致的圆角、SVG 箭头、默认折叠与摘要行；修复全部展开/折叠对工具块无效的问题。
          - **UI 打磨**：文件快照改用统一折叠块（修复 ▼ 图标 bug、中文标签）；Cursor / VS Code / IntelliJ 改用官方 logo；齿轮图标适配明暗主题；设置弹窗固定尺寸，切换标签页不再跳动。

          ### Downloads

          | Platform | File | Notes |
          |----------|------|-------|
          | macOS (Apple Silicon) | `*.dmg` | Drag to Applications folder |
          | macOS (Apple Silicon) | `*.zip` | Portable, unzip and run |
          | Windows | `*.exe` (NSIS) | Standard installer |
          | Windows | `*.exe` (Portable) | No installation needed |
          | Linux | `*.AppImage` | Make executable and run |

          ### ⚠️ macOS 安装提示（应用未做代码签名）

          应用未做 Apple 代码签名，从浏览器下载的安装包在较新 macOS（Sequoia 等）上会提示「已损坏，无法打开」。**应用本身没有损坏**，这是 macOS Gatekeeper 对未签名应用的隔离。打开「终端」执行下面命令解除即可：

          ```
          xattr -cr "/Applications/Claude History.app"
          ```

          ### 关于自动更新

          - **Windows / Linux**：支持应用内自动检查与更新（未签名，首次运行会有 SmartScreen 提示，属正常）。
          - **macOS**：因未签名，**不支持应用内自动更新**（electron-updater 在 mac 上强制要求签名）。请手动下载新版覆盖安装。

          ### System Requirements

          - **macOS** 10.15+ (Catalina or later)
          - **Windows** 10 or later
          - **Linux** — Most distributions with glibc 2.28+

          ---

          **Full Changelog**: https://github.com/cloud-mouse/claude-history/commits/${TAG}
          BODY

          sed -i "s|\${TAG}|$TAG|g" /tmp/release-notes.md

          gh release edit "$TAG" --notes-file /tmp/release-notes.md --repo "${{ github.repository }}"
